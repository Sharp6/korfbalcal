<table mat-table [dataSource]="games" class="mat-elevation-z8">
  <ng-container matColumnDef="selected">
    <th mat-header-cell *matHeaderCellDef> Gebruik </th>
    <td mat-cell *matCellDef="let game">
      <mat-checkbox [checked]="isSelected(game)" (change)="toggleSelection(game, $event.checked)"></mat-checkbox>
    </td>
  </ng-container>

  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef> Title </th>
    <td mat-cell *matCellDef="let game"> {{game.title}} </td>
  </ng-container>

  <ng-container matColumnDef="team">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> team </th>
    <td mat-cell *matCellDef="let game"> {{game.team}} </td>
  </ng-container>

  <ng-container matColumnDef="isHomeGame">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> thuiswedstrijd? </th>
    <td mat-cell *matCellDef="let game">
      <mat-icon [innerText]="game.isHomeGame ? 'home' : 'airport_shuttle'"></mat-icon>
    </td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Datum </th>
    <td mat-cell *matCellDef="let game"> {{game.start | date:'dd/MM'}} </td>
  </ng-container>

  <ng-container matColumnDef="time">
    <th mat-header-cell *matHeaderCellDef> tijd </th>
    <td mat-cell *matCellDef="let game"> {{game.start | date:'HH:mm'}} - {{game.end | date:'HH:mm'}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
